---
name: Go release
run-name: Go release

# Build static Go binaries for every target platform and attach them to a
# GitHub release.
#
# This exists because one thing in the house is installed as a binary rather
# than run as a container: a daemon that drives the local docker socket is
# simpler and no less secure outside a container than inside one with the
# socket mounted in.
#
# It runs after container-build.yml and takes that workflow's version output,
# so a release has one version and the git tag already exists when this starts.
# An empty version means container-build skipped the release, and so does this.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to release, e.g. 1.4.2. Pass the version output of
          container-build.yml. Empty skips the whole job.
        required: true
        type: string
      working_directory:
        description: "Directory containing go.mod."
        required: false
        type: string
        default: "."
      main_package:
        description: "Package to build, relative to working_directory."
        required: false
        type: string
        default: "./cmd/..."
      binary_name:
        description: >-
          Base name of the published artifacts. Each becomes
          <binary_name>_<goos>_<goarch>. Empty uses the name Go gives the
          binary, which is the last element of main_package.
        required: false
        type: string
        default: ""
      tag_prefix:
        description: >-
          Prefix of the git tag, matching the tag_prefix container-build.yml
          published with. The tag is <tag_prefix><version>.
        required: false
        type: string
        default: "v"
      go_version_file:
        description: "File the Go version is read from, relative to working_directory."
        required: false
        type: string
        default: "go.mod"
      platforms:
        description: "Comma-separated GOOS/GOARCH pairs to build."
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      ldflags_version_var:
        description: >-
          Fully qualified variable the version is linked into, e.g.
          main.version. Empty builds without it, and the binary then reports
          whatever its default is.
        required: false
        type: string
        default: "main.version"
      build_tags:
        description: "Comma-separated build tags."
        required: false
        type: string
        default: ""
      checksums:
        description: "Publish a SHA256SUMS file alongside the binaries."
        required: false
        type: boolean
        default: true
      generate_notes:
        description: "Let GitHub generate the release notes from the commits."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  go-release:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ inputs.version != '' }}
    permissions:
      contents: write # create the release and upload assets
    # Never cancelled: a half-uploaded release is worse than a slow one, and
    # two runs would race for the same tag.
    concurrency:
      group: ${{ github.workflow }}-go-release-${{ inputs.working_directory }}-${{ inputs.version }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag was pushed by the job that produced this version, after
          # this workflow's own ref was resolved. Fetch it explicitly.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working_directory }}/${{ inputs.go_version_file }}
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      # -trimpath so the binary carries no build-host paths, -s -w so it
      # carries no symbol table: both make the artifact reproducible for
      # anyone who wants to rebuild and compare it.
      - name: Build
        id: build
        shell: bash
        env:
          BINARY_NAME: ${{ inputs.binary_name }}
          BUILD_TAGS: ${{ inputs.build_tags }}
          LDFLAGS_VERSION_VAR: ${{ inputs.ldflags_version_var }}
          MAIN_PACKAGE: ${{ inputs.main_package }}
          PLATFORMS: ${{ inputs.platforms }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # A workflow command reads %, CR and LF as syntax, so anything that
          # comes from a tool or an input has to be escaped before it goes in.
          # Property values carry two more: a comma or a colon would end the
          # property early and let the rest of a path inject further commands.
          escape_message() {
            local value="${1//%/%25}"
            value="${value//$'\r'/%0D}"
            printf '%s' "${value//$'\n'/%0A}"
          }

          escape_property() {
            local value
            value="$(escape_message "$1")"
            value="${value//,/%2C}"
            printf '%s' "${value//:/%3A}"
          }

          ldflags="-s -w"
          if [[ -n "${LDFLAGS_VERSION_VAR}" ]]; then
            ldflags+=" -X ${LDFLAGS_VERSION_VAR}=${VERSION}"
          fi

          args=(-trimpath "-ldflags=${ldflags}")
          if [[ -n "${BUILD_TAGS}" ]]; then
            args+=("-tags=${BUILD_TAGS}")
          fi
          read -ra pkgs <<< "${MAIN_PACKAGE}"

          dist="${RUNNER_TEMP}/dist"
          stage="${RUNNER_TEMP}/stage"
          rm -rf "${dist}" "${stage}"
          mkdir -p "${dist}"

          IFS=',' read -ra platforms <<< "${PLATFORMS}"
          for platform in "${platforms[@]}"; do
            platform="${platform// /}"
            [[ -n "${platform}" ]] || continue
            goos="${platform%%/*}"
            goarch="${platform##*/}"

            rm -rf "${stage}"
            mkdir -p "${stage}"
            echo "Building ${goos}/${goarch}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build "${args[@]}" -o "${stage}/" "${pkgs[@]}"

            built=("${stage}"/*)
            if [[ "${#built[@]}" -ne 1 ]]; then
              printf '::error::%s\n' \
                "$(escape_message "main_package '${MAIN_PACKAGE}' produced ${#built[@]} binaries; name exactly one")"
              exit 1
            fi

            name="${BINARY_NAME}"
            if [[ -z "${name}" ]]; then
              name="$(basename "${built[0]}")"
            fi
            mv "${built[0]}" "${dist}/${name}_${goos}_${goarch}"
          done

          if [[ -z "$(ls -A "${dist}")" ]]; then
            printf '::error::%s\n' \
              "$(escape_message "platforms '${PLATFORMS}' produced no binaries")"
            exit 1
          fi

          echo "dist=${dist}" >> "${GITHUB_OUTPUT}"
          ls -l "${dist}"

      - name: Write SHA256SUMS
        if: inputs.checksums
        shell: bash
        env:
          DIST: ${{ steps.build.outputs.dist }}
        run: |
          set -euo pipefail
          cd "${DIST}"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # gh release create rather than an action: it is on every runner, it is
      # what an operator would type, and it needs no third-party pin.
      - name: Publish the release
        shell: bash
        env:
          DIST: ${{ steps.build.outputs.dist }}
          GENERATE_NOTES: ${{ inputs.generate_notes }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_prefix }}${{ inputs.version }}
        run: |
          set -euo pipefail

          # A workflow command reads %, CR and LF as syntax, so anything that
          # comes from a tool or an input has to be escaped before it goes in.
          # Property values carry two more: a comma or a colon would end the
          # property early and let the rest of a path inject further commands.
          escape_message() {
            local value="${1//%/%25}"
            value="${value//$'\r'/%0D}"
            printf '%s' "${value//$'\n'/%0A}"
          }

          escape_property() {
            local value
            value="$(escape_message "$1")"
            value="${value//,/%2C}"
            printf '%s' "${value//:/%3A}"
          }

          if ! git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            printf '::error::%s\n' \
              "$(escape_message "tag ${TAG} does not exist; run this after the job that publishes tags")"
            exit 1
          fi

          args=(--title "${TAG}")
          if [[ "${GENERATE_NOTES}" == "true" ]]; then
            args+=(--generate-notes)
          else
            args+=(--notes "")
          fi

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists, uploading assets to it."
            gh release upload "${TAG}" "${DIST}"/* --clobber
          else
            gh release create "${TAG}" "${DIST}"/* "${args[@]}"
          fi

          {
            echo "### Release ${TAG}"
            echo ""
            echo '```'
            ls -1 "${DIST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
...
