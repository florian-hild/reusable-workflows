---
name: Python tests
run-name: Python tests

# pytest over a uv-managed project.

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing pyproject.toml and uv.lock."
        required: false
        type: string
        default: "."
      test_path:
        description: "Path passed to pytest, relative to working_directory."
        required: false
        type: string
        default: "tests/"
      pytest_args:
        description: "Additional arguments passed to pytest."
        required: false
        type: string
        default: "-q"
      check_lock:
        description: >-
          Verify that uv.lock still matches pyproject.toml. A stale lock file
          means the tests ran against different dependencies than a later
          build would use.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-python-test-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working_directory }}/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check that uv.lock is current
        if: inputs.check_lock
        run: uv lock --check

      - name: Run pytest
        run: uv run pytest ${{ inputs.test_path }} ${{ inputs.pytest_args }}
...
