---
name: Python lint
run-name: Python lint

# Ruff over a uv-managed project. Lint and format are separate switches so a
# project can adopt the linter without reformatting its whole tree first.

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing pyproject.toml and uv.lock."
        required: false
        type: string
        default: "."
      paths:
        description: "Paths passed to ruff, relative to working_directory."
        required: false
        type: string
        default: "."
      check_format:
        description: "Also run `ruff format --check`."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No concurrency group here on purpose. It would key on the caller's
    # workflow name and this workflow's inputs, so a caller that invokes this
    # workflow twice - two package sets, two suites, two directories - lands
    # both calls in one group and the later one cancels the earlier. That
    # failure is silent: the cancelled job reports zero steps and no reason.
    #
    # Concurrency is therefore the caller's to declare, and this is a real
    # behavioural dependency rather than a convention: nothing here cancels a
    # superseded run any more, so a caller that wants one cancelled has to say
    # so itself, on the calling workflow, where it also knows how many times it
    # invokes this one.
    #
    #   concurrency:
    #     group: ${{ github.workflow }}-${{ github.ref }}
    #     cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working_directory }}/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # --output-format github turns findings into inline annotations on the
      # pull request instead of a wall of log output.
      - name: Run ruff check
        run: uv run ruff check --output-format github ${{ inputs.paths }}

      - name: Run ruff format --check
        if: inputs.check_format
        run: uv run ruff format --check ${{ inputs.paths }}
...
